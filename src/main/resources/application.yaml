spring:
  application:
    name: PlanIt
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planit}
    username: ${DB_USERNAME:planit}
    password: ${DB_PASSWORD:planit}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

planit:
  security:
    jwt:
      issuer: planit
      secret: 0123456789012345678901234567890101234567890123456789012345678901
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
  ai:
    arrangement:
      mode: ${PLANIT_AI_ARRANGEMENT_MODE:rule-based}
      provider: ${PLANIT_AI_ARRANGEMENT_PROVIDER:groq}
      timeout-seconds: 20
    groq:
      base-url: https://api.groq.com/openai
      model: ${PLANIT_AI_GROQ_MODEL:llama-3.3-70b-versatile}
      api-key: ${GROQ_API_KEY:}
    gemini:
      base-url: https://generativelanguage.googleapis.com
      model: gemini-2.0-flash
      api-key: ${GEMINI_API_KEY:}
