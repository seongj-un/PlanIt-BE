spring:
  application:
    name: PlanIt
  datasource:
    url: jdbc:h2:mem:planit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

planit:
  security:
    jwt:
      issuer: planit
      secret: 0123456789012345678901234567890101234567890123456789012345678901
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
